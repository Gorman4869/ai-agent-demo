name: ai-agent-demo-m11

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_agent_test
      POSTGRES_USER: ai_agent
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${M11_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
