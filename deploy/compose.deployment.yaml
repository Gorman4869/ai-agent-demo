name: ai-agent-demo-deployment

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ai_agent_deployment
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${DEPLOY_POSTGRES_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent_deployment"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  knowledge-seed:
    image: ai-agent-demo-backend:local
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    command: ["python", "-m", "backend.app.deployment_seed"]
    environment: &backend_environment
      AI_AGENT_RUNTIME: manual
      AI_AGENT_MODEL_PROVIDER: mock
      AI_AGENT_ONLINE_ENABLED: "false"
      AI_AGENT_PERSISTENCE: postgres
      AI_AGENT_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
      AI_AGENT_EMBEDDING_PROVIDER: offline
      AI_AGENT_EMBEDDING_DIMENSIONS: "3"
    secrets:
      - postgres_dsn
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  backend:
    image: ai-agent-demo-backend:local
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    init: true
    environment: *backend_environment
    secrets:
      - postgres_dsn
    depends_on:
      postgres:
        condition: service_healthy
      knowledge-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DEPLOY_BACKEND_PORT:-18000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    image: ai-agent-demo-frontend:local
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEPLOY_FRONTEND_PORT:-15173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: "${AI_AGENT_DEPLOY_POSTGRES_PASSWORD_FILE:?set the PostgreSQL password secret file}"
  postgres_dsn:
    file: "${AI_AGENT_DEPLOY_POSTGRES_DSN_FILE:?set the PostgreSQL DSN secret file}"
