name: ai-agent-demo

services:
  backend:
    image: ai-agent-demo-backend:local
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    image: ai-agent-demo-frontend:local
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
