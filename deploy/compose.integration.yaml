name: ai-agent-demo-integration

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    pull_policy: never
    environment:
      POSTGRES_DB: ai_agent_integration
      POSTGRES_USER: ai_agent
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${INTEGRATION_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent_integration"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
