iddle">POST 创建 + 幂等键</text><path d="M365 270 L870 270" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="617.5" y="258" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#17324d" text-anchor="middle">原子创建 Run / request</text><path d="M365 335 L115 335" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240.0" y="323" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#17324d" text-anchor="middle">202 + 原 Run ID</text><path d="M625 400 L870 400" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="747.5" y="388" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#17324d" text-anchor="middle">执行并持久化事件</text><path d="M115 465 L365 465" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240.0" y="453" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#17324d" text-anchor="middle">GET events?after=N</text><path d="M870 530 L365 530" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="617.5" y="518" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#17324d" text-anchor="middle">读取已提交事件</text><path d="M365 595 L115 595" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240.0" y="583" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#17324d" text-anchor="middle">领域 SSE / 最终 snapshot</text><path d="M115 660 L365 660" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240.0" y="648" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#17324d" text-anchor="middle">刷新后同 Run 快照与续传</text><text x="40" y="771" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#53677a" text-anchor="start">断流只停止观察；取消/审批使用独立命令。Notifier 唤醒，EventStore 保留事实。</text></svg>
