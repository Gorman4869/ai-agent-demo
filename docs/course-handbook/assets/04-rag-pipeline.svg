<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-label="RAG：建立索引与回答问题是两条链"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#53677a"/></marker></defs><rect width="1000" height="615" fill="white"/><text x="40" y="48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#17324d" text-anchor="start">RAG：建立索引与回答问题是两条链</text><rect x="35" y="110" width="245" height="95" rx="12" fill="#edf7f6" stroke="#147d83" stroke-width="2"/><text x="157.5" y="149.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">文档与版本</text><text x="157.5" y="179.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">规范化 / 切片</text><rect x="370" y="110" width="250" height="95" rx="12" fill="#edf7f6" stroke="#147d83" stroke-width="2"/><text x="495.0" y="149.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">同模型编码</text><text x="495.0" y="179.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">向量 / 索引</text><rect x="710" y="110" width="250" height="95" rx="12" fill="#edf7f6" stroke="#147d83" stroke-width="2"/><text x="835.0" y="149.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">KnowledgeBase</text><text x="835.0" y="179.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">存储可检索切片</text><path d="M280 155 L370 155" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 155 L710 155" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="330" width="245" height="100" rx="12" fill="#edf7f6" stroke="#147d83" stroke-width="2"/><text x="157.5" y="372.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">问题 → 检索候选</text><text x="157.5" y="402.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">排序 / Top-K</text><rect x="370" y="330" width="250" height="100" rx="12" fill="#edf7f6" stroke="#147d83" stroke-width="2"/><text x="495.0" y="372.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">阈值与上下文选择</text><text x="495.0" y="402.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">信任 / 来源 / 预算</text><rect x="710" y="330" width="250" height="100" rx="12" fill="#edf7f6" stroke="#147d83" stroke-width="2"/><text x="835.0" y="372.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">生成与审核</text><text x="835.0" y="402.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">引用 / 拒答</text><path d="M835 205 L835 270" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M835 270 L160 270" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M160 270 L160 330" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 380 L370 380" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 380 L710 380" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="45" y="500" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#53677a" text-anchor="start">候选 ≠ 入选证据；引用 ≠ 每句事实正确。</text><text x="45" y="530" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#53677a" text-anchor="start">当前旧 writer 拼接全部候选，低分混入失败见 K051。</text><text x="40" y="591" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#53677a" text-anchor="start">上排建立可查资料；下排消费当次证据；文档更新与历史引用不能混用。</text></svg>
