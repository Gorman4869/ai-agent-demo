d" text-anchor="middle">completed</text><path d="M450 215 L210 340" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="405" y="340" width="240" height="85" rx="12" fill="#eef3fa" stroke="#147d83" stroke-width="2"/><text x="525.0" y="389.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">failed</text><path d="M450 215 L525 340" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="340" width="240" height="85" rx="12" fill="#eef3fa" stroke="#147d83" stroke-width="2"/><text x="840.0" y="389.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#17324d" text-anchor="middle">cancelled</text><path d="M450 215 L840 340" fill="none" stroke="#53677a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="55" y="495" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#53677a" text-anchor="start">三种 Run 终态不可重开；取消/完成竞争由持久 CAS 仲裁。</text><text x="55" y="525" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" fill="#53677a" text-anchor="start">ToolExecution 另有 UNKNOWN：它不是 RunStatus 的一种状态。</text><text x="40" y="586" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#53677a" text-anchor="start">图示省略部分合法边和错误细节；真实转移以 domain/run.py 及 Store 合同为准。</text></svg>
